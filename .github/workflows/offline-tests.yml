name: offline-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run work-hygiene tests
        run: >-
          node --test
          plugins/dsh-work-hygiene/tests/pure.test.mjs
          plugins/dsh-work-hygiene/tests/operation.test.mjs
          plugins/dsh-work-hygiene/tests/config.test.mjs
          plugins/dsh-work-hygiene/tests/arbiter.test.mjs
          plugins/dsh-work-hygiene/tests/host_preexecute.test.mjs
          plugins/dsh-work-hygiene/tests/audit.test.mjs
          plugins/dsh-work-hygiene/tests/host.test.mjs
          plugins/dsh-work-hygiene/tests/local_model.test.mjs
      - name: Run offline tests
        run: python tests/run_offline.py
